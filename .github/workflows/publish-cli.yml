name: Publish CLI

on:
  push:
    tags: ["cli-v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@arker-ai/cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: bun ci

      - name: Verify package version matches tag
        working-directory: cli
        run: |
          tag="${GITHUB_REF#refs/tags/cli-v}"
          pkg=$(bun -e "console.log(require('./package.json').version)")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag cli-v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Build SDK
        working-directory: typescript
        run: bun run build:sdk

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Test
        working-directory: cli
        run: bun run test

      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public
