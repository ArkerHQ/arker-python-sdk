name: OpenAPI contract

# This privileged workflow runs only trusted code from the base branch. It reads
# the pull request's managed contract files through raw.githubusercontent.com
# and compares their bytes; it never checks out or executes pull request code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # Install only dependencies pinned by the trusted base branch, before the
      # installation token exists in the job.
      - name: Install TypeScript generator
        working-directory: typescript
        run: npm ci

      - name: Install Python generator
        run: uv sync --project python --locked --group dev

      - name: Create read-only arker-app token
        id: contract-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ARKER_CONTRACT_APP_ID }}
          private-key: ${{ secrets.ARKER_CONTRACT_APP_PRIVATE_KEY }}
          owner: ArkerHQ
          repositories: arker-app
          permission-contents: read

      - name: Verify pull request contract artifacts
        env:
          GH_TOKEN: ${{ steps.contract-app-token.outputs.token }}
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_REF: ${{ github.event.pull_request.head.sha }}
        run: >-
          ./scripts/check-openapi
          --candidate-repository "$CANDIDATE_REPOSITORY"
          --candidate-ref "$CANDIDATE_REF"
