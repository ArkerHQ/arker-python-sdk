name: Publish TypeScript SDK

# Triggers on `typescript-v*` tags (e.g. `typescript-v0.1.0`). Tag prefix
# distinguishes TS releases from Python ones in this monorepo.
#
# Publishes to the npm registry with Bun and the NPM_ACCESS_TOKEN repo secret.

on:
  push:
    tags: ["typescript-v*"]

defaults:
  run:
    working-directory: typescript

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@arker-ai/sdk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install deps
        run: bun ci

      - name: Verify package version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/typescript-v}"
          pkg=$(bun -e "console.log(require('./package.json').version)")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag typescript-v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Check generated API types
        run: bun run check:api-types

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
