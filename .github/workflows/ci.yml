name: CI

# Runs the unit suites on every PR and on pushes to main. The publish workflows only
# fire on release tags, so this is what actually gates changes.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install TypeScript generator
        working-directory: typescript
        run: npm ci
      - name: Install Python generator
        run: uv sync --project python --locked --group dev
      - name: Check generated contract artifacts
        run: ./scripts/check-openapi --offline
      - name: Test contract enforcement
        run: python tests/test_openapi_enforcement.py

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pulls httpx[http2] + pytest)
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Install deps
        run: bun ci
      - name: Check generated API types
        run: bun run check:api-types
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
