name: CI

# Runs the unit suites on every PR and on pushes to main. The publish workflows only
# fire on release tags, so this is what actually gates changes.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pulls httpx[http2] + pytest)
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Install deps
        run: bun ci
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
