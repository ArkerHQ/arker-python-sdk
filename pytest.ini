[pytest]
# scripts/check-local and CI run pytest from the repo root, where pytest finds
# no config inside python/ — so root runs ignore python/pyproject.toml entirely.
# Collection rules that must hold for those runs belong here.
#
# `e2e` is the live suite: it needs credentials and real VMs, and is never part
# of an offline run. Run it deliberately, from python/: `pytest tests/e2e`.
# The defaults are repeated because setting this key replaces them.
norecursedirs = .* build dist node_modules venv e2e
addopts = -q
