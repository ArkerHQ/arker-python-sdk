[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arker"
version = "0.8.5"
description = "Python client for the Arker virtual computer platform."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Arker", email = "support@arker.ai" }]
keywords = ["arker", "vm", "sandbox", "agent", "code-execution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# httpx is the HTTP backend; the http2 extra pulls in `h2` so requests negotiate
# HTTP/2 (falling back to HTTP/1.1 per host via ALPN).
dependencies = [
    "httpx[http2]>=0.27",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Interactive PTY (VM.connect_pty) needs a WebSocket client.
pty = ["websocket-client>=1.7"]

[project.urls]
Homepage = "https://arker.ai"
Documentation = "https://arker.ai/docs"
Source = "https://github.com/ArkerHQ/arker-sdk"
Issues = "https://github.com/ArkerHQ/arker-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `test_e2e.py` and `test_presigned.py` hit a live deployment; skip
# unless ARKER_API_KEY is set in the environment.
addopts = "-q"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.45.0",
]
